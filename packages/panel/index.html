<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Writeback</title>
<style>
  :root, :root[data-theme="light"] {
    --bg: #F2F4F3; --panel: #FEFEFE; --inset: #EFF2F1; --well: #F7F9F8;
    --line: #E3E7E5; --line2: #D3D9D6; --hairline: rgba(255,255,255,.7);
    --fg: #181D1C; --dim: #5D6764; --faint: #9AA4A0;
    --acc: #0B7A6E; --acc-2: #0F9485; --acc-soft: #E4F2EF; --acc-line: #B9DDD6; --acc-glow: rgba(11,122,110,.16);
    --add: #0E8A5F; --add-bg: #E8F5EE; --del: #C23838; --del-bg: #FBECEC;
    --amber: #96690A; --amber-bg: #FBF3DF; --amber-line: #EBD9A8;
    --chip: #F0F2F1; --chip-line: #E1E5E3;
    --gutter: #AEB8B4; --code-dim: #7E8985;
    --shadow-2: 0 2px 8px rgba(15,20,18,.10);
  }
  :root[data-theme="dark"] {
    --bg: #0A0D0E; --panel: #131819; --inset: #191F21; --well: #0F1415;
    --line: #212A2B; --line2: #2C3739; --hairline: rgba(255,255,255,.035);
    --fg: #E9EDEB; --dim: #95A19D; --faint: #5B6864;
    --acc: #4FD6C4; --acc-2: #6FE3D3; --acc-soft: #11302C; --acc-line: #1E4741; --acc-glow: rgba(79,214,196,.14);
    --add: #4CC893; --add-bg: #12291F; --del: #F27272; --del-bg: #2E1717;
    --amber: #E3B341; --amber-bg: #292112; --amber-line: #4D3D1B;
    --chip: #1B2224; --chip-line: #273032;
    --gutter: #43504D; --code-dim: #6C7A76;
    --shadow-2: 0 2px 8px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 system-ui, "Segoe UI Variable Text", "Segoe UI", -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  header {
    flex: none; display: flex; align-items: center; gap: 8px; height: 42px;
    padding: 0 10px 0 14px; background: linear-gradient(var(--panel), var(--well)); border-bottom: 1px solid var(--line);
  }
  .wordmark { display: flex; align-items: center; gap: 7px; margin-right: auto; }
  .wordmark .wbmark { color: var(--fg); flex: none; }
  .wordmark .mark { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-weight: 650; font-size: 11.5px; letter-spacing: .14em; }
  .wordmark .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--add); transition: background .2s;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--add) 18%, transparent); animation: beat 2.6s ease-in-out infinite; }
  .wordmark .dot.off { background: var(--del); box-shadow: 0 0 0 3px color-mix(in srgb, var(--del) 18%, transparent); animation: none; }
  @keyframes beat { 50% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--add) 10%, transparent); } }
  body.disconnected #content, body.disconnected #rail, body.disconnected .tools { opacity: .45; pointer-events: none; }
  .hset { display: flex; align-items: center; background: var(--well); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .iconbtn {
    height: 26px; min-width: 28px; display: inline-grid; place-items: center; padding: 0 9px;
    background: transparent; border: none; border-radius: 0; cursor: pointer;
    color: var(--dim); font-size: 12px; line-height: 1; transition: background .12s, color .12s;
    font-family: "Cascadia Code", ui-monospace, Consolas, monospace;
  }
  .hset .iconbtn + .iconbtn { border-left: 1px solid var(--line); }
  .iconbtn:hover { background: var(--inset); color: var(--fg); }
  .iconbtn.on { color: var(--amber); background: var(--amber-bg); }
  .iconbtn sup { font-size: 8px; margin-left: 2px; }
  header a.iconbtn { text-decoration: none; font-size: 11px; display: inline-flex; align-items: center; }

  #scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  #scroll::-webkit-scrollbar { width: 10px; }
  #scroll::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; border: 3px solid var(--bg); }

  .hint-empty { padding: 52px 22px 40px; text-align: center; color: var(--faint); position: relative; }
  .hint-empty .field { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 84px, var(--acc-glow), transparent 46%); }
  .ret { width: 52px; height: 52px; margin: 0 auto 18px; position: relative; }
  .ret svg { display: block; animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ret .ctr { position: absolute; inset: 0; display: grid; place-items: center; }
  .ret .ctr i { width: 5px; height: 5px; border-radius: 50%; background: var(--acc); }
  .hint-empty p { margin: 0 0 22px; font-size: 13px; color: var(--dim); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; text-align: left; font-size: 11.5px; color: var(--dim); width: fit-content; margin: 0 auto; position: relative; }
  .keys kbd { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 10px; color: var(--fg); background: var(--inset);
    box-shadow: inset 0 0 0 1px var(--line2), inset 0 -2px 0 var(--line2); border-radius: 4px; padding: 1.5px 6px; margin-right: 3px; }

  .selcard { border-bottom: 1px solid var(--line); background: linear-gradient(color-mix(in srgb, var(--acc-soft) 26%, var(--panel)), var(--panel) 82%); }
  .crumbwrap { padding: 12px 14px 8px; }
  .components { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
  .components .sep { color: var(--faint); font-weight: 400; font-size: 12px; }
  .components .up { color: var(--dim); font-weight: 500; }
  .components .plus { color: var(--acc); font-weight: 600; font-size: 11.5px; }
  .srcline { margin-top: 6px; }
  .srcline a { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); cursor: pointer; font-size: 11px; text-decoration: none;
    background: var(--well); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .srcline a:hover { border-color: var(--acc-line); color: var(--fg); }
  .srcline a .ln { color: var(--acc); }
  .srcline a .go { color: var(--faint); font-size: 9px; }
  .tokens { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 14px 12px; }
  .tk { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 10.5px; padding: 2.5px 7px; border-radius: 5px;
    background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-line); border: none; color: var(--dim); }
  .tk.mine { color: var(--fg); box-shadow: inset 0 0 0 1px var(--acc-line); background: var(--acc-soft); }
  .tk.arb { color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber-line); background: var(--amber-bg); }
  .tk.now { color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); background: var(--acc-soft); font-weight: 650; cursor: pointer; }
  .pair { display: inline-flex; align-items: center; gap: 5px; padding: 2.5px 7px; border-radius: 5px; cursor: pointer;
    background: var(--acc-soft); box-shadow: inset 0 0 0 1px var(--acc);
    font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 10.5px; }
  .pair .old { color: var(--faint); text-decoration: line-through; }
  .pair .ar { color: var(--acc); font-size: 9px; }
  .pair .new { color: var(--acc); font-weight: 650; }
  .tokens .none { font-size: 11.5px; color: var(--faint); }

  .banner { margin: 10px 14px 0; padding: 8px 11px; border-radius: 8px; font-size: 12px; line-height: 1.5;
    background: var(--acc-soft); box-shadow: inset 0 0 0 1px var(--acc-line); color: var(--fg); }
  .banner b { font-weight: 600; }
  .banner.amber { background: var(--amber-bg); box-shadow: inset 0 0 0 1px var(--amber-line); color: var(--amber); }
  .banner a { color: var(--acc); cursor: pointer; margin-right: 8px; text-decoration: none; }
  .banner a:hover { text-decoration: underline; }

  .refused { margin: 14px 14px; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--amber-line); }
  .refused .rh { display: flex; align-items: center; gap: 9px; padding: 10px 13px;
    background: var(--amber-bg); color: var(--amber); font-weight: 650; font-size: 12.5px; }
  .refused .rh .code { margin-left: auto; font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 9.5px; font-weight: 500;
    opacity: .85; background: color-mix(in srgb, var(--amber) 12%, transparent); padding: 1px 7px; border-radius: 99px; }
  .refused .why { padding: 10px 13px 4px; color: var(--dim); font-size: 12px; line-height: 1.6; }
  .refused .why b { color: var(--fg); font-weight: 600; }
  .hints { padding: 7px 13px 12px; }
  .hints .lead { color: var(--dim); font-size: 11.5px; margin-bottom: 6px; }
  .hints a { display: flex; gap: 8px; align-items: center; font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 11px;
    color: var(--dim); padding: 5px 9px; margin: 0 -9px; border-radius: 6px; text-decoration: none; cursor: pointer; }
  .hints a:hover { background: var(--inset); color: var(--fg); }
  .hints a .cmp { color: var(--fg); font-weight: 600; }
  .hints a .loc { color: var(--acc); }

  section { border-bottom: 1px solid var(--line); }
  section h2 { display: flex; align-items: center; gap: 8px; margin: 0; padding: 11px 14px 7px; cursor: pointer; user-select: none;
    font-family: "Cascadia Code", ui-monospace, Consolas, monospace;
    font-size: 9.5px; font-weight: 650; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  section h2:hover { color: var(--dim); }
  section h2 .chev { font-size: 7px; color: var(--acc); transition: transform .15s; }
  section h2 .cnt { margin-left: auto; font-size: 9px; color: var(--acc); background: var(--acc-soft); border-radius: 99px; padding: 0 6px; letter-spacing: 0; }
  section.closed .chev { transform: rotate(-90deg); }
  section .body { padding: 2px 14px 13px; display: flex; flex-direction: column; gap: 7px; }
  section.closed .body { display: none; }
  section.closed h2 { padding-bottom: 11px; }

  .row { display: flex; align-items: center; gap: 10px; min-height: 30px; position: relative; }
  .row label { width: 62px; flex: none; color: var(--dim); font-size: 12px; }
  .row.staged label { color: var(--acc); font-weight: 600; }
  .row.staged::before { content: ""; position: absolute; left: -14px; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; background: var(--acc); }

  .stepper { display: flex; align-items: stretch; height: 29px; margin-left: auto;
    border: none; border-radius: 8px; background: var(--well); overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--line2), inset 0 1.5px 3px rgba(0,0,0,.05); }
  .stepper button { width: 27px; border: none; background: transparent; color: var(--dim); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0; border-radius: 0; transition: background .1s; }
  .stepper button:hover { background: var(--inset); color: var(--acc); }
  .stepper button:active { background: var(--acc-soft); color: var(--acc); }
  .stepper .val { min-width: 58px; display: grid; place-items: center; font-size: 12px; padding: 0 8px;
    border-left: 1px solid var(--line); border-right: 1px solid var(--line); font-weight: 550;
    font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
  .stepper .val.unset { color: var(--faint); font-weight: 400; font-size: 11px; }
  .stepper.staged { box-shadow: inset 0 0 0 1.5px var(--acc), 0 0 10px var(--acc-glow); }
  .stepper .from { color: var(--faint); text-decoration: line-through; margin-right: 7px; font-weight: 400; }
  .stepper .to { color: var(--acc); font-weight: 650; }
  .dimval { color: var(--faint) !important; font-weight: 400 !important; }

  /* per-property revert — appears only on a staged row */
  .revert { flex: none; width: 28px; height: 28px; padding: 0; display: grid; place-items: center;
    border: none; box-shadow: inset 0 0 0 1px var(--line2); border-radius: 7px; background: var(--panel); color: var(--dim);
    cursor: pointer; font-size: 14px; line-height: 1; transition: color .12s, box-shadow .12s; }
  .revert:hover { color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }

  select { margin-left: auto; height: 29px; padding: 0 8px; border: none; box-shadow: inset 0 0 0 1px var(--line2);
    border-radius: 7px; background: var(--well); font-size: 12px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--acc); height: 29px; margin: 0; }
  .rangeval { min-width: 32px; text-align: right; color: var(--dim); font-size: 12px; }

  .colorhead { display: flex; align-items: center; gap: 7px; min-height: 26px; font-size: 12px; color: var(--dim); }
  .colorhead .chipdot { width: 15px; height: 15px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line2); flex: none; }
  .colorhead .name { font-weight: 550; color: var(--fg); font-size: 11.5px; }
  .colorhead .name.staged { color: var(--acc); }
  .pill { margin-left: auto; height: 22px; padding: 0 9px; border-radius: 99px; border: none; box-shadow: inset 0 0 0 1px var(--line2);
    background: transparent; color: var(--dim); font-size: 11px; cursor: pointer; transition: all .12s; }
  .pill.on { background: var(--add-bg); box-shadow: inset 0 0 0 1px var(--add); color: var(--add); }
  .contrast { font-size: 11px; color: var(--dim); margin: 3px 0; font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
  .contrast b.pass { color: var(--add); } .contrast b.fail { color: var(--del); }
  .swatches { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin: 6px 0 4px; max-height: 118px; overflow-y: auto; padding: 3px; }
  .sw { aspect-ratio: 1; border-radius: 5px; border: none; box-shadow: inset 0 0 0 1px rgba(127,127,127,.28); cursor: pointer; padding: 0; transition: transform .08s; }
  .sw:hover { transform: scale(1.25); box-shadow: inset 0 0 0 1px var(--fg); position: relative; z-index: 1; }
  .sw:focus-visible { transform: scale(1.25); position: relative; z-index: 1; }
  .sw.sel { outline: 2px solid var(--acc); outline-offset: 2px; }
  .sw.fail { opacity: .14; pointer-events: none; }
  .colorblock + .colorblock { border-top: 1px solid var(--line); margin-top: 9px; padding-top: 8px; }
  .customrow { display: flex; gap: 6px; margin-top: 5px; }
  .custom { flex: 1; height: 28px; padding: 0 9px; border: 1px dashed var(--amber-line); background: transparent;
    color: var(--amber); border-radius: 7px; font-size: 11.5px; }
  .custom::placeholder { color: var(--amber); opacity: .55; }
  .custom:focus { border-style: solid; outline: none; }
  .custom.bad { border-color: var(--del); color: var(--del); }
  .custom-apply { height: 28px; padding: 0 10px; border: 1px solid var(--amber-line); background: transparent;
    color: var(--amber); border-radius: 7px; font-size: 13px; cursor: pointer; }
  .custom-apply:hover { background: var(--amber-bg); }

  /* ── the write rail ── */
  #rail { flex: none; display: none; background: var(--panel); position: relative; }
  #rail::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 1;
    background: linear-gradient(90deg, var(--acc), color-mix(in srgb, var(--acc) 20%, transparent)); }
  #rail .railin { border-top: 1px solid var(--line); box-shadow: 0 -8px 24px var(--acc-glow); }
  .railh { display: flex; align-items: center; gap: 8px; padding: 10px 14px 0; }
  .railh .t { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 9.5px; font-weight: 650;
    letter-spacing: .2em; text-transform: uppercase; color: var(--acc); }
  .railh .caret { width: 6px; height: 11px; background: var(--acc); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .railh .n { margin-left: auto; font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 10px; color: var(--faint); }
  .diffs { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 4px; max-height: 92px; overflow-y: auto; }
  .dl { display: flex; gap: 7px; align-items: center; font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 11px; }
  .dl .g { width: 22px; color: var(--gutter); font-size: 9.5px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .dl .del { color: var(--del); background: var(--del-bg); padding: 1.5px 7px; border-radius: 5px; }
  .dl .add { color: var(--add); background: var(--add-bg); padding: 1.5px 7px; border-radius: 5px; }
  .dl .x { margin-left: auto; color: var(--faint); font-size: 10px; cursor: pointer; opacity: .7; background: none; border: none; padding: 2px 4px; }
  .dl .x:hover { color: var(--del); opacity: 1; }

  #dryrun { margin: 9px 14px 0; background: var(--well); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  #dryrun .dh { display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-bottom: 1px solid var(--line);
    font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 9.5px; color: var(--code-dim); }
  #dryrun .dh .file { color: var(--fg); }
  #dryrun .dh .dry { margin-left: auto; color: var(--acc); background: var(--acc-soft); border-radius: 99px; padding: 0 7px; font-size: 9px; letter-spacing: .08em; }
  #dryrun pre { margin: 0; padding: 7px 0; font-family: "Cascadia Code", ui-monospace, Consolas, monospace;
    font-size: 10.5px; line-height: 1.7; overflow-x: auto; max-height: 132px; overflow-y: auto; }
  #dryrun .cl { display: flex; white-space: pre; padding: 0 10px; }
  #dryrun .cl.d { background: var(--del-bg); color: var(--del); }
  #dryrun .cl.a { background: var(--add-bg); color: var(--add); }
  #dryrun .cl.h { color: var(--code-dim); }

  .railbtns { display: flex; gap: 8px; padding: 11px 14px 13px; align-items: center; }
  .btn { height: 31px; padding: 0 14px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--inset); box-shadow: inset 0 0 0 1px var(--line2); color: var(--fg); font-size: 12.5px; font-weight: 550; }
  .btn:hover { background: var(--chip); }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--dim); }
  .btn.ghost:hover { color: var(--del); background: transparent; }
  .btn.write { margin-left: auto; background: linear-gradient(var(--acc-2), var(--acc));
    color: var(--bg); font-weight: 700; letter-spacing: .01em;
    box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 2px 10px var(--acc-glow); }
  .btn.write:hover { filter: brightness(1.06); background: linear-gradient(var(--acc-2), var(--acc)); }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none; }

  footer { flex: none; border-top: 1px solid var(--line); background: var(--well); padding: 9px 14px 11px; max-height: 26vh; overflow-y: auto; }
  .tools { display: flex; gap: 5px; margin-bottom: 8px; }
  .tools .btn { height: 26px; padding: 0 10px; font-size: 11.5px; }
  .histhead { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; font-size: 9px; font-weight: 650;
    letter-spacing: .2em; text-transform: uppercase; color: var(--faint); margin: 1px 0 6px; }
  .journal .e { display: flex; align-items: center; gap: 9px; min-height: 22px; font-size: 10.5px; color: var(--dim);
    font-family: "Cascadia Code", ui-monospace, Consolas, monospace; border-radius: 4px; padding: 0 4px; margin: 0 -4px; }
  .journal .e:hover { background: var(--inset); }
  .journal .e .mk { width: 5px; height: 5px; border-radius: 50%; background: var(--add); flex: none; }
  .journal .e .file { color: var(--fg); font-weight: 550; flex: none; }
  .journal .e .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .journal .e button { flex: none; height: 17px; padding: 0 6px; font-size: 9px; border-radius: 4px;
    border: none; box-shadow: inset 0 0 0 1px var(--line2); background: var(--panel); color: var(--dim); cursor: pointer; opacity: 0; transition: opacity .1s; }
  .journal .e:hover button, .journal .e button:focus-visible { opacity: 1; }
  .journal .e button:hover { color: var(--del); box-shadow: inset 0 0 0 1px var(--del); }
  .journal .none { color: var(--faint); font-size: 10px; }

  .toast { position: fixed; left: 12px; right: 12px; bottom: 10px; z-index: 10;
    background: var(--amber-bg); box-shadow: inset 0 0 0 1px var(--amber-line), var(--shadow-2); color: var(--amber);
    border-radius: 7px; padding: 6px 10px; font-size: 10.5px; animation: rise .18s ease-out; }
  .toast.ok { background: var(--add-bg); box-shadow: inset 0 0 0 1px var(--add), var(--shadow-2); color: var(--add); }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<header>
  <span class="wordmark"><svg class="wbmark" viewBox="0 0 32 32" width="15" height="15" fill="none" aria-hidden="true"><g transform="translate(1 0)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 H19 C24 17 24 9 19 9 H13" stroke="var(--acc)"/><path d="M11.75 12.25 L7 17 L11.75 21.75" stroke="currentColor"/></g></svg><span class="mark">WRITEBACK</span><span class="dot" id="status" title="Connected"></span></span>
  <span class="hset">
    <button class="iconbtn" id="driftToggle" title="Drift radar — outline off-scale values" aria-label="Toggle drift radar">◇</button>
    <a class="iconbtn" href="/export" target="_blank" title="Session changelog" aria-label="Export session changelog">export</a>
    <button class="iconbtn" id="themeToggle" title="Switch theme" aria-label="Switch to dark theme">☾</button>
  </span>
</header>

<div id="scroll">
  <div id="crumb">
    <div class="hint-empty">
      <div class="field"></div>
      <div class="ret">
        <svg viewBox="0 0 52 52" width="52" height="52" fill="none" aria-hidden="true">
          <circle cx="26" cy="26" r="20" stroke="var(--acc-line)" stroke-width="1.5"/>
          <path d="M26 2 v9 M26 41 v9 M2 26 h9 M41 26 h9" stroke="var(--acc)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="ctr"><i></i></span>
      </div>
      <p>Click any element in the app<br />to inspect and edit its source.</p>
      <div class="keys">
        <span><kbd>↑</kbd><kbd>↓</kbd></span><span>step padding</span>
        <span><kbd>Alt</kbd>+arrows</span><span>step margin</span>
        <span><kbd>Shift</kbd>+arrows</span><span>step gap</span>
        <span><kbd>d</kbd></span><span>drift radar</span>
        <span><kbd>Esc</kbd></span><span>deselect</span>
      </div>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- the write rail: staged edits as diff lines + dry-run review before anything touches disk -->
<div id="rail"><div class="railin">
  <div class="railh"><span class="t">Pending write</span><span class="caret" aria-hidden="true"></span><span class="n" id="railn"></span></div>
  <div class="diffs" id="diffs"></div>
  <div id="dryrun" hidden>
    <div class="dh"><span class="file" id="dryfile"></span><span class="dry">DRY-RUN</span></div>
    <pre id="drypre"></pre>
  </div>
  <div class="railbtns">
    <button class="btn ghost" id="reset">Discard</button>
    <button class="btn" id="review">Review diff</button>
    <button class="btn write" id="save">Write</button>
  </div>
</div></div>

<footer>
  <div class="tools" id="tools" hidden>
    <button class="btn" id="copy">Copy styles</button><button class="btn" id="paste" disabled>Paste</button>
  </div>
  <div class="journal" id="journal"></div>
</footer>

<script>
function $(id) { return document.getElementById(id) }
const EMPTY_STATE = $('crumb').innerHTML

// ── theme ──
function applyThemeButton(theme) {
  $('themeToggle').textContent = theme === 'light' ? '☾' : '☀'
  $('themeToggle').setAttribute('aria-label', theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme')
}
const savedTheme = localStorage.getItem('wb-theme') || 'light'
document.documentElement.dataset.theme = savedTheme
applyThemeButton(savedTheme)
$('themeToggle').onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
  document.documentElement.dataset.theme = next
  localStorage.setItem('wb-theme', next)
  applyThemeButton(next)
}
$('driftToggle').onclick = () => parent.postMessage({ t: 'wb-drift-toggle' }, '*')

// ── token scales (standard Tailwind sets; spacing/colors come from the project config) ──
const SIZES = ['xs', 'sm', 'base', 'lg', 'xl', '2xl', '3xl', '4xl', '5xl', '6xl', '7xl', '8xl', '9xl']
const WEIGHTS = ['thin', 'extralight', 'light', 'normal', 'medium', 'semibold', 'bold', 'extrabold', 'black']
// font families come from the project's theme (config.fonts) at render time, not this list
const TRACKING = ['tighter', 'tight', 'normal', 'wide', 'wider', 'widest']
const LEADING = ['none', 'tight', 'snug', 'normal', 'relaxed', 'loose']
const ROUNDED = ['none', 'sm', 'DEFAULT', 'md', 'lg', 'xl', '2xl', '3xl', 'full']
const SHADOWS = ['none', '2xs', 'xs', 'sm', 'DEFAULT', 'md', 'lg', 'xl', '2xl', 'inner']
const MANAGED = ['p', 'px', 'py', 'm', 'gap', 'bg', 'text', 'text-size', 'font-weight', 'font-family', 'tracking', 'leading', 'rounded', 'shadow', 'opacity']
const SECTION_GROUPS = {
  Spacing: ['p', 'px', 'py', 'm', 'gap'],
  Typography: ['text-size', 'font-weight', 'font-family', 'tracking', 'leading'],
  Colors: ['text', 'bg'],
  Appearance: ['rounded', 'shadow', 'opacity'],
}

// CSS approximations for live preview (the real value is written as a class on Write)
const SIZE_CSS = { xs: '.75rem', sm: '.875rem', base: '1rem', lg: '1.125rem', xl: '1.25rem', '2xl': '1.5rem', '3xl': '1.875rem', '4xl': '2.25rem', '5xl': '3rem', '6xl': '3.75rem', '7xl': '4.5rem', '8xl': '6rem', '9xl': '8rem' }
const WEIGHT_CSS = { thin: 100, extralight: 200, light: 300, normal: 400, medium: 500, semibold: 600, bold: 700, extrabold: 800, black: 900 }
const TRACK_CSS = { tighter: '-.05em', tight: '-.025em', normal: '0', wide: '.025em', wider: '.05em', widest: '.1em' }
const LEAD_CSS = { none: '1', tight: '1.25', snug: '1.375', normal: '1.5', relaxed: '1.625', loose: '2' }
const ROUND_CSS = { none: '0', sm: '.125rem', DEFAULT: '.25rem', md: '.375rem', lg: '.5rem', xl: '.75rem', '2xl': '1rem', '3xl': '1.5rem', full: '9999px' }
const SHADOW_CSS = { none: 'none', '2xs': '0 1px 1px rgba(0,0,0,.05)', xs: '0 1px 2px rgba(0,0,0,.05)', sm: '0 1px 3px rgba(0,0,0,.1)', DEFAULT: '0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06)', md: '0 4px 6px rgba(0,0,0,.1)', lg: '0 10px 15px rgba(0,0,0,.1)', xl: '0 20px 25px rgba(0,0,0,.1)', '2xl': '0 25px 50px rgba(0,0,0,.25)', inner: 'inset 0 2px 4px rgba(0,0,0,.06)' }

const spacingCss = (v) => v == null ? null : v.startsWith('[') ? v.slice(1, -1) : v === 'px' ? '1px' : parseFloat(v) * 0.25 + 'rem'
const colorCss = (v) => config.colors[v] || (v && v.startsWith('[') ? v.slice(1, -1) : v)

function cssFor(group, v) {
  switch (group) {
    case 'p': return { padding: spacingCss(v) }
    case 'px': return { paddingLeft: spacingCss(v), paddingRight: spacingCss(v) }
    case 'py': return { paddingTop: spacingCss(v), paddingBottom: spacingCss(v) }
    case 'm': return { margin: spacingCss(v) }
    case 'gap': return { gap: spacingCss(v) }
    case 'text-size': return { fontSize: SIZE_CSS[v] || null }
    case 'font-weight': return { fontWeight: String(WEIGHT_CSS[v] || '') }
    case 'font-family': return { fontFamily: (config.fonts && config.fonts[v]) || null }
    case 'tracking': return { letterSpacing: TRACK_CSS[v] ?? null }
    case 'leading': return { lineHeight: LEAD_CSS[v] ?? null }
    case 'rounded': return { borderRadius: ROUND_CSS[v] ?? null }
    case 'shadow': return { boxShadow: SHADOW_CSS[v] ?? null }
    case 'opacity': return { opacity: v != null ? String(Number(v) / 100) : null }
    case 'bg': return { backgroundColor: colorCss(v) }
    case 'text': return { color: colorCss(v) }
  }
  return {}
}

// ── connection ──
let ws = null, retry = null
let config = { spacing: [], colors: {} }
let sel = null, multi = []
let draft = {}          // group -> staged value, not yet written to source
let clipboard = null
const send = (m) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(m)) }
const previewStyle = (style) => parent.postMessage({ t: 'wb-preview', style }, '*')
const previewClear = () => parent.postMessage({ t: 'wb-preview-clear' }, '*')

function connect() {
  ws = new WebSocket('ws://127.0.0.1:7331')
  ws.onopen = () => {
    document.body.classList.remove('disconnected')
    $('status').classList.remove('off'); $('status').title = 'Connected'
    busy = false; editQueue.length = 0
    send({ t: 'config' }); send({ t: 'journal' })
  }
  ws.onmessage = onMessage
  ws.onclose = () => {
    document.body.classList.add('disconnected')
    $('status').classList.add('off'); $('status').title = 'Disconnected — is the dev server running?'
    if (!retry) retry = setTimeout(() => { retry = null; connect() }, 1500)
  }
  ws.onerror = () => ws.close()
}

const sameLoc = (a, b) => a && b && a.file === b.file && a.line === b.line && a.col === b.col
const clamp = (i, list) => Math.min(list.length - 1, Math.max(0, i))

window.addEventListener('message', (e) => {
  const d = e.data
  if (d?.t === 'wb-select') {
    if (d.add && sel) { multi.push({ loc: d.loc, hash: null, classes: null }); send({ t: 'resolve', loc: d.loc }) }
    else { sel = { loc: d.loc, components: d.components || [], computed: d.computed || {} }; multi = []; draft = {}; invalidateReview(); send({ t: 'resolve', loc: sel.loc }) }
  }
  if (d?.t === 'wb-nudge' && sel?.classes) {
    const cur = valueOf(d.group)
    const i = config.spacing.indexOf(cur)
    const next = config.spacing[clamp((i < 0 ? config.spacing.indexOf('4') : i) + d.dir, config.spacing)]
    if (next !== undefined) stage(d.group, next)
  }
  if (d?.t === 'wb-deselect') { sel = null; multi = []; draft = {}; invalidateReview(); previewClear(); showEmpty() }
  if (d?.t === 'wb-drift-state') {
    $('driftToggle').classList.toggle('on', !!d.on)
    $('driftToggle').innerHTML = d.on && d.count ? '◇<sup>' + d.count + '</sup>' : '◇'
    $('driftToggle').title = !d.on ? 'Drift radar — outline off-scale values'
      : d.count ? `Drift radar: ${d.count} off-scale value${d.count === 1 ? '' : 's'}`
      : 'Drift radar: no off-scale values found'
  }
})

function onMessage(e) {
  const m = JSON.parse(e.data)
  if (m.t === 'config') config = m
  if (m.t === 'resolved') {
    const extra = multi.find((x) => sameLoc(x.loc, m.loc))
    if (extra) { extra.hash = m.hash; extra.classes = m.classes; render(); afterResolve(); return }
    if (!sel || !sameLoc(sel.loc, m.loc)) return
    Object.assign(sel, { hash: m.hash, classes: m.classes, blast: m.blast, hints: m.hints, dirty: m.dirty, instance: m.instance, reason: m.reason, locked: m.locked })
    render(); afterResolve()
  }
  if (m.t === 'edited' && m.dry) {
    if (m.diff) dryDiffs.push(m.diff)
    if (--dryPending <= 0) finishReview()
    return
  }
  if (m.t === 'edited' && !m.dry) {
    if (m.warn) toast(m.warn)
    send({ t: 'journal' })
    pendingResolves = reresolveLocs.length || 1
    ;(reresolveLocs.length ? reresolveLocs : [sel?.loc]).filter(Boolean).forEach((l) => send({ t: 'resolve', loc: l }))
    reresolveLocs = []
  }
  if (m.t === 'refused') {
    toast('Edit refused: ' + m.reason.replace(/-/g, ' '))
    editQueue.length = 0; reresolveLocs = []; saving = false
    dryPending = 0; dryDiffs = []; reviewing = false
    if (sel) { busy = true; pendingResolves = 1; send({ t: 'resolve', loc: sel.loc }) } else busy = false
  }
  if (m.t === 'journal') renderJournal(m.entries)
}

function afterResolve() {
  if (busy && pendingResolves > 0 && --pendingResolves === 0) {
    busy = false
    if (saving && !editQueue.length) finishSave()
    else pump()
  }
}

// ── staging ──
// Controls never touch source directly — they stage a value and preview it live.
// Review shows the server dry-run diff; Write commits the whole draft; Discard restores.
function stage(group, value) {
  if (!sel || sel.classes === null) return
  draft[group] = value
  invalidateReview()
  applyPreview()
  const st = $('scroll').scrollTop
  render()
  $('scroll').scrollTop = st
}

function draftStyle() {
  const style = {}
  for (const [g, v] of Object.entries(draft)) {
    for (const [k, val] of Object.entries(cssFor(g, v))) if (val != null) style[k] = val
  }
  return style
}
function applyPreview() {
  const s = draftStyle()
  if (Object.keys(s).length) previewStyle(s)
  else previewClear()
  updateRail()
}

// token as it will be written for a staged group (mirror of the server's buildToken for display)
function tokenFor(g, v) {
  return g === 'text-size' ? 'text-' + v : g === 'font-weight' || g === 'font-family' ? 'font-' + v : v === 'DEFAULT' ? g : `${g}-${v}`
}
// source token currently owning a group on the selected element (for the − side of a diff line)
function sourceTokenIn(classes, group) {
  if (!classes) return null
  for (const c of classes) if (matchGroup(c, group) !== null) return c
  return null
}

// ── the write rail ──
let reviewing = false, dryPending = 0, dryDiffs = []
function invalidateReview() {
  reviewing = false; dryPending = 0; dryDiffs = []
  $('dryrun').hidden = true
  $('drypre').innerHTML = ''
}
function updateRail() {
  const n = Object.keys(draft).length
  $('rail').style.display = n ? 'block' : 'none'
  if (!n) { invalidateReview(); return }
  $('railn').textContent = `${n} change${n > 1 ? 's' : ''} · ${multi.length ? (multi.length + 1) + ' elements' : '1 file'}`
  const box = $('diffs'); box.innerHTML = ''
  for (const [g, v] of Object.entries(draft)) {
    const line = el('div', 'dl')
    line.appendChild(el('span', 'g', String(sel?.loc.line ?? '')))
    const old = sourceTokenIn(sel?.classes, g)
    if (old) line.appendChild(el('span', 'del', '− ' + old))
    line.appendChild(el('span', 'add', '+ ' + tokenFor(g, v)))
    const x = el('button', 'x', '✕'); x.title = 'Discard this change'; x.onclick = () => unstage(g)
    line.appendChild(x)
    box.appendChild(line)
  }
  // bulk edits skip the dry-run gate (the protocol's bulk has no dry mode) — Write applies directly
  $('review').style.display = multi.length ? 'none' : ''
  $('save').textContent = multi.length ? `Write to ${multi.length + 1} elements` : 'Write to ' + (sel ? sel.loc.file.split('/').pop() : '')
}

$('review').onclick = () => {
  if (!sel || !Object.keys(draft).length || busy || dryPending) return
  dryDiffs = []; dryPending = Object.keys(draft).length
  for (const [group, value] of Object.entries(draft)) {
    const op = { kind: 'tw', group, variants: [], value, raw: value.startsWith('[') }
    send({ t: 'edit', id: crypto.randomUUID(), loc: sel.loc, hash: sel.hash, op, dry: true })
  }
}
function finishReview() {
  reviewing = true
  $('dryfile').textContent = sel ? sel.loc.file : ''
  const pre = $('drypre'); pre.innerHTML = ''
  for (const diff of dryDiffs) for (const l of diff.split('\n')) {
    const cls = l[0] === '+' && l[1] !== '+' ? 'a' : l[0] === '-' && l[1] !== '-' ? 'd' : l.startsWith('@@') ? 'h' : ''
    pre.appendChild(el('span', 'cl ' + cls, l + '\n'))
  }
  $('dryrun').hidden = false
}

function rerender() { const st = $('scroll').scrollTop; render(); $('scroll').scrollTop = st }
// un-stage a single property, keeping the rest of the draft
function unstage(group) { delete draft[group]; invalidateReview(); applyPreview(); rerender() }
$('reset').onclick = () => { draft = {}; invalidateReview(); previewClear(); rerender(); updateRail() }
$('save').onclick = () => {
  if (!Object.keys(draft).length || busy) return
  saving = true
  for (const [group, value] of Object.entries(draft)) editQueue.push({ group, value })
  pump()
}
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && Object.keys(draft).length) {
    e.preventDefault()
    if (reviewing || multi.length) $('save').click(); else $('review').click()
  }
})

function finishSave() {
  saving = false
  draft = {}
  invalidateReview()
  previewClear()
  updateRail()
  toast('Wrote ' + (sel ? sel.loc.file.split('/').pop() : ''), true)
}

// ── serialized write queue (fixes stale-hash refusals on multi-op saves) ──
const editQueue = []
let busy = false, pendingResolves = 0, reresolveLocs = [], saving = false

function pump() {
  if (busy || !sel || !editQueue.length) return
  const { group, value } = editQueue.shift()
  // bracketed custom values are the explicit off-scale escape hatch → raw
  const op = { kind: 'tw', group, variants: [], value, raw: value.startsWith('[') }
  if (multi.length && multi.every((x) => x.hash)) {
    busy = true; reresolveLocs = [sel.loc, ...multi.map((x) => x.loc)]
    send({ t: 'bulk', id: crypto.randomUUID(), edits: [sel, ...multi].map((s) => ({ loc: s.loc, hash: s.hash ?? sel.hash, op })) })
    return
  }
  busy = true; reresolveLocs = [sel.loc]
  send({ t: 'edit', id: crypto.randomUUID(), loc: sel.loc, hash: sel.hash, op })
}

$('copy').onclick = () => {
  if (!sel?.classes) return
  clipboard = sel.classes.filter((c) => MANAGED.some((g) => matchGroup(c, g) !== null))
  $('paste').disabled = !clipboard?.length
}
$('paste').onclick = () => {
  if (!clipboard) return
  for (const tok of clipboard) for (const g of MANAGED) { const v = matchGroup(tok, g); if (v !== null) { draft[g] = v; break } }
  invalidateReview(); applyPreview(); const st = $('scroll').scrollTop; render(); $('scroll').scrollTop = st
}

function matchGroup(cls, group) {
  if (cls.includes(':')) return null
  const neg = cls.startsWith('-')
  const base = neg ? cls.slice(1) : cls
  switch (group) {
    case 'text-size': { const m = base.match(/^text-(.+)$/); return m && SIZES.includes(m[1]) ? m[1] : null }
    case 'font-weight': { const m = base.match(/^font-(.+)$/); return m && WEIGHTS.includes(m[1]) ? m[1] : null }
    case 'font-family': { const m = base.match(/^font-(.+)$/); return m && config.fonts && (m[1] in config.fonts) ? m[1] : null }
    case 'tracking': { const m = base.match(/^tracking-(.+)$/); return m ? m[1] : null }
    case 'leading': { const m = base.match(/^leading-(.+)$/); return m ? m[1] : null }
    case 'opacity': { const m = base.match(/^opacity-(.+)$/); return m ? m[1] : null }
    case 'rounded': { if (base === 'rounded') return 'DEFAULT'; const m = base.match(/^rounded-(.+)$/); return m && ROUNDED.includes(m[1]) ? m[1] : null }
    case 'shadow': { if (base === 'shadow') return 'DEFAULT'; const m = base.match(/^shadow-(.+)$/); return m && SHADOWS.includes(m[1]) ? m[1] : null }
  }
  if (!base.startsWith(group + '-')) return null
  const rest = base.slice(group.length + 1)
  if (group === 'p' || group === 'm') { if (/^[trblxy]-/.test(rest)) return null }
  if (group === 'gap' && /^[xy]-/.test(rest)) return null
  if (group === 'text' && (SIZES.includes(rest) || rest.startsWith('[') || /^(left|center|right|justify|start|end|wrap|nowrap|balance|pretty|ellipsis|clip|opacity-)/.test(rest))) return null
  if (group === 'bg' && /^(gradient-|linear-|radial-|conic-|cover$|contain$|auto$|center|top|bottom|left|right|repeat|no-repeat|fixed$|local$|scroll$|clip-|origin-|blend-|opacity-|none$)/.test(rest)) return null
  return neg ? '-' + rest : rest
}

// source value for a group (ignoring draft) — used to detect multi-select disagreement
function sourceValueIn(classes, group) {
  if (!classes) return null
  for (const c of classes) { const v = matchGroup(c, group); if (v !== null) return v }
  return null
}
// displayed value: draft wins, then this element's source, else null
function valueOf(group) {
  if (group in draft) return draft[group]
  return sourceValueIn(sel.classes, group)
}
const isStaged = (group) => group in draft
// true when a multi-selection's elements disagree on this group's source value
function isMixed(group) {
  if (!multi.length || group in draft) return false
  const base = sourceValueIn(sel.classes, group)
  return multi.some((x) => x.classes && sourceValueIn(x.classes, group) !== base)
}

function computedOf(group) { const v = sel.computed?.[group]; return v ? v.replace(/^0px$/, '0') : null }

function renderJournal(entries) {
  const j = $('journal')
  j.innerHTML = '<div class="histhead">History</div>'
  if (!entries.length) { j.innerHTML += '<div class="none">Saved edits appear here, each with undo.</div>'; return }
  for (const en of entries.slice(-8).reverse()) {
    const row = el('div', 'e')
    row.append(el('span', 'mk'), el('span', 'file', en.file.split('/').pop()), el('span', 'what', en.summary.replace(/^\+\s*/, '').slice(0, 46)))
    const b = el('button', null, 'undo'); b.onclick = () => send({ t: 'undo', id: en.id })
    row.appendChild(b); j.appendChild(row)
  }
}

function toast(text, ok) {
  document.querySelector('.toast')?.remove()
  const d = el('div', 'toast' + (ok ? ' ok' : ''), (ok ? '✓ ' : '') + text)
  document.body.appendChild(d)
  setTimeout(() => d.remove(), ok ? 1600 : 5000)
}

const probe = document.createElement('div'); document.body.appendChild(probe)
function rgbOf(css) { probe.style.color = ''; probe.style.color = css; if (!probe.style.color) return null; const m = getComputedStyle(probe).color.match(/[\d.]+/g); return m ? m.slice(0, 3).map(Number) : null }
function luminance([r, g, b]) { const f = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4) }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b) }
function contrast(c1, c2) { const a = rgbOf(c1), b = rgbOf(c2); if (!a || !b) return null; const [l1, l2] = [luminance(a), luminance(b)].sort((x, y) => y - x); return (l1 + 0.05) / (l2 + 0.05) }

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n }
// small revert control shown on a staged row — resets just that one property
function revertBtn(group) { const b = el('button', 'revert', '↺'); b.title = 'Reset this change'; b.onclick = (e) => { e.stopPropagation(); unstage(group) }; return b }

function stepperOver(group, label, list, opts = {}) {
  const cur = valueOf(group), staged = isStaged(group), mixed = isMixed(group)
  const row = el('div', 'row' + (staged ? ' staged' : ''))
  row.appendChild(el('label', null, label))
  const box = el('div', 'stepper' + (staged ? ' staged' : ''))
  const step = (delta) => {
    const i = list.indexOf(valueOf(group))
    const next = list[clamp((i < 0 ? (opts.startAt ?? Math.floor(list.length / 2)) : i) + delta, list)]
    if (next !== undefined) stage(group, next)
  }
  const mk = (txt, delta) => {
    const b = el('button', null, txt); b.title = (delta > 0 ? 'Increase ' : 'Decrease ') + label; b.onclick = () => step(delta)
    if (opts.previewCss) {
      b.onmouseenter = () => { const i = list.indexOf(valueOf(group)); const nx = list[clamp((i < 0 ? (opts.startAt ?? 0) : i) + delta, list)]; const c = opts.previewCss(nx); if (c) previewStyle({ ...draftStyle(), ...c }) }
      b.onmouseleave = () => applyPreview()
    }
    return b
  }
  const v = el('span', 'val num')
  if (staged) {
    // staged wells show the pending change inline: old → new
    const from = sourceValueIn(sel.classes, group)
    const wrap = el('span')
    if (from !== null) wrap.appendChild(el('span', 'from', from === 'DEFAULT' ? 'base' : from))
    wrap.appendChild(el('span', 'to', cur === 'DEFAULT' ? 'base' : cur))
    v.appendChild(wrap)
  } else {
    const shown = mixed ? 'mixed' : cur === 'DEFAULT' ? 'base' : (cur ?? computedOf(group) ?? '—')
    v.textContent = shown
    if (cur === null && !mixed) { v.classList.add('unset'); v.title = 'Current computed value — no class sets this yet' }
  }
  box.append(mk('−', -1), v, mk('+', 1)); row.appendChild(box)
  if (staged) row.appendChild(revertBtn(group))
  return row
}

function selectOver(group, label, list) {
  const cur = valueOf(group), staged = isStaged(group)
  const row = el('div', 'row' + (staged ? ' staged' : ''))
  row.appendChild(el('label', null, label))
  const s = document.createElement('select')
  const none = el('option', null, cur === null ? (computedOf(group) ?? 'not set') + ' (computed)' : '(inherited)'); none.value = ''
  s.appendChild(none)
  for (const v of list) { const o = el('option', null, v); o.value = v; if (v === cur) o.selected = true; s.appendChild(o) }
  s.onchange = () => { if (s.value) stage(group, s.value) }
  row.appendChild(s)
  if (staged) row.appendChild(revertBtn(group))
  return row
}

function sliderOver(group, label, max, step) {
  const cur = valueOf(group), staged = isStaged(group)
  const row = el('div', 'row' + (staged ? ' staged' : ''))
  row.appendChild(el('label', null, label))
  const r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = max; r.step = step; r.value = cur ?? computedOf(group) ?? max
  const v = el('span', 'rangeval mono num' + (cur === null ? ' dimval' : ''), cur ?? computedOf(group) ?? '—')
  r.oninput = () => { v.textContent = r.value; previewStyle({ ...draftStyle(), opacity: String(Number(r.value) / 100) }) }
  r.onchange = () => stage(group, r.value)
  row.append(r, v)
  if (staged) row.appendChild(revertBtn(group))
  return row
}

// roving-tabindex color grid: one tab stop, arrows move focus
function colorBlock(group, title) {
  const wrap = el('div', 'colorblock')
  const other = group === 'bg' ? 'text' : 'bg'
  const pairName = valueOf(other), pairCss = pairName ? config.colors[pairName] : null
  const curName = valueOf(group), staged = isStaged(group)

  const head = el('div', 'colorhead')
  if (curName && config.colors[curName]) {
    const dot = el('span', 'chipdot'); dot.style.background = config.colors[curName]
    head.append(dot, el('span', null, title + ' '), el('span', 'name mono' + (staged ? ' staged' : ''), curName))
  } else if (curName) { head.append(el('span', null, title + ' '), el('span', 'name' + (staged ? ' staged' : ''), curName + ' (custom)')) }
  else { const comp = computedOf(group); const dot = el('span', 'chipdot'); if (comp) dot.style.background = comp; head.append(dot, el('span', null, title + ' '), el('span', 'name dimval', comp ? 'computed' : 'not set')); if (comp) head.querySelector('.name').title = comp }
  let aaOnly = false
  if (pairCss) { const cb = el('button', 'pill', 'AA only'); cb.style.marginLeft = 'auto'; cb.title = 'Hide colors failing WCAG AA'; cb.onclick = () => { aaOnly = !aaOnly; cb.classList.toggle('on', aaOnly); paint() }; head.appendChild(cb) }
  if (staged) { const rb = revertBtn(group); if (!pairCss) rb.style.marginLeft = 'auto'; head.appendChild(rb) }
  wrap.appendChild(head)

  if (pairCss && curName && config.colors[curName]) { const r = contrast(config.colors[curName], pairCss); if (r) { const c = el('div', 'contrast'); c.innerHTML = `contrast <b class="${r >= 4.5 ? 'pass' : 'fail'}">${r.toFixed(2)}</b> ${r >= 4.5 ? '· passes AA' : r >= 3 ? '· large text only' : '· fails AA'}`; wrap.appendChild(c) } }

  const grid = el('div', 'swatches'); grid.setAttribute('role', 'listbox'); grid.setAttribute('aria-label', title + ' color')
  const names = Object.keys(config.colors)
  const paint = () => {
    grid.innerHTML = ''
    names.forEach((name, idx) => {
      const css = config.colors[name]
      const s = el('button', 'sw'); const r = pairCss ? contrast(css, pairCss) : null; const fails = aaOnly && r !== null && r < 4.5
      s.className = 'sw' + (name === curName ? ' sel' : '') + (fails ? ' fail' : '')
      s.style.background = css; s.title = name + (r ? ` · ${r.toFixed(2)}` : ''); s.setAttribute('aria-label', name)
      s.tabIndex = idx === 0 ? 0 : -1
      s.onmouseenter = () => previewStyle({ ...draftStyle(), ...cssFor(group, name) })
      s.onmouseleave = () => applyPreview()
      s.onclick = () => stage(group, name)
      s.onkeydown = (e) => {
        const per = 14, cells = [...grid.children]; let ni = -1
        if (e.key === 'ArrowRight') ni = idx + 1; else if (e.key === 'ArrowLeft') ni = idx - 1
        else if (e.key === 'ArrowDown') ni = idx + per; else if (e.key === 'ArrowUp') ni = idx - per
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stage(group, name); return }
        else return
        e.preventDefault(); const t = cells[ni]; if (t) { s.tabIndex = -1; t.tabIndex = 0; t.focus() }
      }
      grid.appendChild(s)
    })
  }
  paint(); wrap.appendChild(grid)

  const cr = el('div', 'customrow')
  const inp = el('input', 'custom mono'); inp.placeholder = 'custom, e.g. [#ff6600]'
  const apply = el('button', 'custom-apply', '↵'); apply.title = 'Apply custom value'
  const commit = () => {
    const val = inp.value.trim()
    if (!/^\[[^\]]+\]$/.test(val) && !/^\[?#?[0-9a-fA-F]{3,8}\]?$/.test(val)) { inp.classList.add('bad'); return }
    inp.classList.remove('bad'); stage(group, val.startsWith('[') ? val : `[${val}]`)
  }
  inp.oninput = () => inp.classList.remove('bad')
  inp.onkeydown = (e) => { if (e.key === 'Enter') commit() }
  apply.onclick = commit
  cr.append(inp, apply); wrap.appendChild(cr)
  return wrap
}

const openSections = JSON.parse(localStorage.getItem('wb-sections') || '{"Spacing":true,"Typography":true,"Colors":true,"Appearance":false}')
function makeSection(title, children) {
  const s = el('section'); if (!openSections[title]) s.classList.add('closed')
  const h = el('h2'); h.append(el('span', 'chev', '▾'), el('span', null, title))
  const stagedCount = (SECTION_GROUPS[title] || []).filter((g) => g in draft).length
  if (stagedCount) h.appendChild(el('span', 'cnt', stagedCount + ' staged'))
  h.setAttribute('role', 'button'); h.setAttribute('tabindex', '0'); h.setAttribute('aria-expanded', String(!!openSections[title]))
  const toggle = () => { s.classList.toggle('closed'); openSections[title] = !s.classList.contains('closed'); h.setAttribute('aria-expanded', String(openSections[title])); localStorage.setItem('wb-sections', JSON.stringify(openSections)) }
  h.onclick = toggle; h.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle() } }
  const body = el('div', 'body'); children.forEach((c) => body.appendChild(c)); s.append(h, body)
  return s
}

function jumpLink(hint) {
  const a = el('a')
  a.append(el('span', 'cmp', hint.component), el('span', 'loc', `${hint.loc.file}:${hint.loc.line}`))
  a.onclick = () => { sel = { loc: hint.loc, components: [hint.component], computed: {} }; draft = {}; invalidateReview(); send({ t: 'resolve', loc: hint.loc }) }
  return a
}
// compact inline variant for banners
function jumpLinkInline(hint) { const a = el('a', 'mono', `${hint.component} · ${hint.loc.file}:${hint.loc.line}`); a.onclick = () => { sel = { loc: hint.loc, components: [hint.component], computed: {} }; draft = {}; invalidateReview(); send({ t: 'resolve', loc: hint.loc }) }; return a }

function showEmpty() { $('crumb').innerHTML = EMPTY_STATE; $('content').innerHTML = ''; $('tools').hidden = true; updateRail() }

function render() {
  const crumb = $('crumb'); crumb.innerHTML = ''
  const c = $('content'); c.innerHTML = ''
  $('tools').hidden = false

  const card = el('div', 'selcard')
  const cw = el('div', 'crumbwrap')
  const names = el('div', 'components')
  const chain = sel.components.length ? sel.components : ['host element']
  chain.forEach((n, i) => { if (i) names.appendChild(el('span', 'sep', '‹')); names.appendChild(el('span', i ? 'up' : null, n)) })
  if (multi.length) names.appendChild(el('span', 'plus', `+${multi.length} selected`))
  const src = el('div', 'srcline mono')
  const a = el('a'); a.title = 'Open in editor'
  const [fpath, fline] = [sel.loc.file, sel.loc.line]
  a.append(el('span', null, fpath + ':'), el('span', 'ln', String(fline)), el('span', 'go', '↗'))
  a.onclick = () => send({ t: 'open', loc: sel.loc })
  src.appendChild(a)
  cw.append(names, src); card.appendChild(cw)

  if (sel.classes !== null) {
    const strip = el('div', 'tokens')
    const stagedShown = new Set()
    if (!sel.classes.length && !Object.keys(draft).length) strip.appendChild(el('span', 'none', 'no classes yet'))
    for (const t of sel.classes) {
      // a token whose group is staged renders as a before→after capsule
      const g = MANAGED.find((gr) => matchGroup(t, gr) !== null && gr in draft)
      if (g) {
        stagedShown.add(g)
        const cap = el('button', 'pair'); cap.title = 'Click to discard this change'
        cap.append(el('span', 'old', t), el('span', 'ar', '→'), el('span', 'new', tokenFor(g, draft[g])))
        cap.onclick = () => unstage(g)
        strip.appendChild(cap)
        continue
      }
      const managed = MANAGED.some((gr) => matchGroup(t, gr) !== null); const arb = /\[[^\]]*\]/.test(t)
      strip.appendChild(el('span', 'tk' + (arb ? ' arb' : managed ? ' mine' : ''), t))
    }
    for (const [g, v] of Object.entries(draft)) {
      if (stagedShown.has(g)) continue
      const chip = el('button', 'tk now', '+ ' + tokenFor(g, v))
      chip.title = 'Click to discard this change'
      chip.onclick = () => unstage(g)
      strip.appendChild(chip)
    }
    card.appendChild(strip)
  }
  crumb.appendChild(card)

  if (sel.dirty) c.appendChild(el('div', 'banner amber', 'This file has uncommitted manual changes — consider committing first.'))
  if (sel.locked?.length) c.appendChild(el('div', 'banner amber', 'Locked by a runtime condition (edits to these refuse): ' + sel.locked.join(' · ')))

  if (sel.classes === null) {
    const r = el('div', 'refused')
    const rh = el('div', 'rh'); rh.append(el('span', null, 'Can’t edit this safely'), el('span', 'code', sel.reason || 'refused'))
    r.appendChild(rh)
    const why = el('div', 'why')
    if (sel.reason === 'no-classname') why.append('This element has no ', el('b', null, 'className'), ' to edit.')
    else { why.append('Its ', el('b', null, 'className'), ' is computed at runtime, so Writeback ', el('b', null, 'refuses instead of guessing'), ' — a wrong guess would corrupt your source.') }
    r.appendChild(why)
    if (sel.hints?.length) { const h = el('div', 'hints'); h.appendChild(el('div', 'lead', 'The classes likely come from a call site — edit there:')); for (const hint of sel.hints) h.appendChild(jumpLink(hint)); r.appendChild(h) }
    c.appendChild(r); updateRail(); return
  }

  if (sel.instance) {
    const b = el('div', 'banner'); b.append('Edits change the ', el('b', null, sel.instance.component), ' component — every instance updates. ')
    if (!sel.instance.forwards) b.append('It doesn’t accept a className prop, so per-instance editing isn’t possible.')
    else if (sel.hints?.length) { b.append('To change just one, edit its call site: '); sel.hints.forEach((hint) => b.appendChild(jumpLinkInline(hint))) }
    c.appendChild(b)
  }

  c.appendChild(makeSection('Spacing', [
    stepperOver('p', 'padding', config.spacing), stepperOver('px', 'pad x', config.spacing), stepperOver('py', 'pad y', config.spacing),
    stepperOver('m', 'margin', config.spacing), stepperOver('gap', 'gap', config.spacing),
  ]))
  c.appendChild(makeSection('Typography', [
    stepperOver('text-size', 'size', SIZES, { startAt: SIZES.indexOf('base'), previewCss: (v) => v && { fontSize: SIZE_CSS[v] } }),
    stepperOver('font-weight', 'weight', WEIGHTS, { startAt: WEIGHTS.indexOf('normal'), previewCss: (v) => v && { fontWeight: String(WEIGHT_CSS[v]) } }),
    selectOver('font-family', 'font', Object.keys(config.fonts || {})),
    stepperOver('tracking', 'tracking', TRACKING, { startAt: TRACKING.indexOf('normal') }),
    stepperOver('leading', 'leading', LEADING, { startAt: LEADING.indexOf('normal') }),
  ]))
  c.appendChild(makeSection('Colors', [colorBlock('text', 'Text'), colorBlock('bg', 'Background')]))
  c.appendChild(makeSection('Appearance', [
    stepperOver('rounded', 'radius', ROUNDED, { startAt: ROUNDED.indexOf('md') }),
    stepperOver('shadow', 'shadow', SHADOWS, { startAt: SHADOWS.indexOf('DEFAULT') }),
    sliderOver('opacity', 'opacity', 100, 5),
  ]))
  if (sel.blast?.length) c.appendChild(el('div', 'banner', 'cva variants here (edits target the active variant slot): ' + sel.blast.join(' · ')))
  updateRail()
}

connect()
</script>
</body>
</html>
